name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Lockfiles generated behind a private npm mirror can't be fetched from GitHub runners.
      - name: Point lockfile at the public npm registry
        run: sed -i -E 's#https://[^/"]*npm-proxy[^/"]*/#https://registry.npmjs.org/#g' bun.lock
      - run: bun install --frozen-lockfile
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      - run: bun run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
